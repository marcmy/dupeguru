# Produce installable/portable applications, not just compiled test extensions.
name: Build artifacts

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 installer and portable
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.15.1
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt -r requirements-extra.txt
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress
      - name: Build application
        run: python build.py
      - name: Build Windows installer
        run: python package.py
      - name: Create portable ZIP and verify outputs
        shell: pwsh
        run: |
          if (!(Test-Path dist/dupeguru-win64/dupeguru-win64.exe)) {
            throw "Portable Windows executable missing"
          }
          $installer = @(Get-ChildItem -Path dist -Filter 'dupeGuru_win64_*.exe' -File)
          if ($installer.Count -eq 0) { throw "Windows installer missing" }
          Compress-Archive -Path dist/dupeguru-win64 -DestinationPath dist/dupeguru-windows-x64-portable.zip -Force
      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dupeguru-windows-x64-installer
          path: dist/dupeGuru_win64_*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows portable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dupeguru-windows-x64-portable
          path: dist/dupeguru-windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS application
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.15.1
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt -r requirements-extra.txt
      - name: Build application
        run: python build.py
      - name: Create .app and ZIP
        run: |
          python package.py
          test -d dist/dupeguru.app
          ditto -c -k --sequesterRsrc --keepParent dist/dupeguru.app dist/dupeguru-macos.zip
      - name: Upload macOS application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dupeguru-macos-app-unsigned
          path: dist/dupeguru-macos.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x64 portable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.15.1
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt -r requirements-extra.txt "PyQt5>=5.15,<6" "pyinstaller>=6.21,<7"
      - name: Build application
        run: python build.py
      - name: Build portable application
        run: |
          python -m PyInstaller --noconfirm --windowed --onedir --name dupeguru-linux --add-data build/locale:locale --add-data build/help:help run.py
          test -x dist/dupeguru-linux/dupeguru-linux
          tar -czf dist/dupeguru-linux-x64.tar.gz -C dist dupeguru-linux
      - name: Upload Linux portable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dupeguru-linux-x64-portable
          path: dist/dupeguru-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14
