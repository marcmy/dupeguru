# Workflow lints, and checks format in parallel then runs tests on all platforms

name: Default CI/CD

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
  test:
    needs: [pre-commit]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: [3.8, 3.9, "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools
          pip install -r requirements.txt -r requirements-extra.txt
      - name: Build python modules
        run: |
          python build.py --modules
      - name: Run tests
        run: |
          pytest core hscommon
  package:
    name: Package ${{ matrix.artifact }}
    needs: [test]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            artifact: windows-x64
          - os: ubuntu-24.04
            artifact: linux-x64
          - os: macos-15
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.14.4
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.4"
          architecture: "x64"
        if: matrix.artifact == 'windows-x64' || matrix.artifact == 'linux-x64' || matrix.artifact == 'macos-x64'
      - name: Set up Python 3.14.4 (Apple Silicon)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.4"
          architecture: "arm64"
        if: matrix.artifact == 'macos-arm64'
      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -r requirements.txt "pyinstaller>=6.22.3,<7"
      - name: Build application and distributable
        run: python scripts/build_ci_artifacts.py
      - name: Upload downloadable application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dupeguru-${{ matrix.artifact }}-py3144
          path: |
            artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
