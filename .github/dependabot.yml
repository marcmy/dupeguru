version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 100
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 100
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 100
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
