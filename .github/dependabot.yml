version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 100
    
  - package-ecosystem: pre-commit
    directory: /
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 100
    
  - package-ecosystem: github-actions
    directory: /
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 100
